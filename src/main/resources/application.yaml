spring:
  application:
    name: employee-lifecycle-sync
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/employee_lifecycle_sync}
    username: ${DB_USERNAME:employee_sync}
    password: ${DB_PASSWORD:employee_sync_local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
server:
  port: ${PORT:${SERVER_PORT:8080}}
  servlet:
    session:
      timeout: 30m
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: false
        add-additional-paths: false
springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:false}
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:false}
  packages-to-scan: com.kimsooin77.sync.api
app:
  admin:
    username: ${ADMIN_USERNAME:}
    password-hash: ${ADMIN_PASSWORD_HASH:}
  hr:
    base-url: ${HR_BASE_URL:http://127.0.0.1:${server.port:8080}}
    connect-timeout: ${HR_CONNECT_TIMEOUT:2s}
    read-timeout: ${HR_READ_TIMEOUT:5s}
  groupware:
    base-url: ${GROUPWARE_BASE_URL:http://127.0.0.1:${server.port:8080}}
    connect-timeout: ${GROUPWARE_CONNECT_TIMEOUT:2s}
    read-timeout: ${GROUPWARE_READ_TIMEOUT:5s}
  integration:
    worker:
      enabled: ${INTEGRATION_WORKER_ENABLED:false}
      fixed-delay: ${INTEGRATION_WORKER_FIXED_DELAY:3s}
      batch-size: ${INTEGRATION_WORKER_BATCH_SIZE:10}
      recovery-threshold: ${INTEGRATION_WORKER_RECOVERY_THRESHOLD:60s}
  mock:
    hr:
      enabled: ${MOCK_HR_ENABLED:false}
      scenario: ${MOCK_HR_SCENARIO:initial}
    groupware:
      enabled: ${MOCK_GROUPWARE_ENABLED:false}
      default-failure-mode: ${MOCK_GROUPWARE_DEFAULT_FAILURE_MODE:NORMAL}
      default-delay-ms: ${MOCK_GROUPWARE_DEFAULT_DELAY_MS:1000}
      timeout-delay-ms: ${MOCK_GROUPWARE_TIMEOUT_DELAY_MS:6000}
      max-delay-ms: ${MOCK_GROUPWARE_MAX_DELAY_MS:30000}
