plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
}

apply plugin: 'io.spring.dependency-management'

group = 'com.kimsooin77.sync'
version = '0.0.1-SNAPSHOT'
description = 'Employee Lifecycle Sync'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def frontendDistProperty = providers.gradleProperty('frontendDistDir')
def frontendDistDirectory = frontendDistProperty.isPresent()
        ? layout.dir(frontendDistProperty.map { path ->
            def candidate = new File(path)
            candidate.isAbsolute() ? candidate : file(path)
        })
        : layout.projectDirectory.dir('frontend/dist')
def externallyBuiltFrontend = frontendDistProperty.isPresent()
def frontendDirectory = layout.projectDirectory.dir('frontend')
def npmExecutable = System.getProperty('os.name').toLowerCase().contains('windows') ? 'npm.cmd' : 'npm'

tasks.register('frontendNpmCi', Exec) {
    group = 'build'
    description = 'Installs the locked frontend dependencies.'
    workingDir frontendDirectory
    commandLine npmExecutable, 'ci'
    inputs.files(layout.projectDirectory.file('frontend/package.json'), layout.projectDirectory.file('frontend/package-lock.json'))
    outputs.dir(layout.projectDirectory.dir('frontend/node_modules'))
    outputs.upToDateWhen { false }
    onlyIf { !externallyBuiltFrontend }
}

tasks.register('frontendTest', Exec) {
    group = 'verification'
    description = 'Runs the frontend unit tests.'
    dependsOn 'frontendNpmCi'
    workingDir frontendDirectory
    commandLine npmExecutable, 'test'
    outputs.upToDateWhen { false }
    onlyIf { !externallyBuiltFrontend }
}

tasks.register('frontendBuild', Exec) {
    group = 'build'
    description = 'Builds the React application.'
    dependsOn 'frontendTest'
    workingDir frontendDirectory
    commandLine npmExecutable, 'run', 'build'
    inputs.dir(layout.projectDirectory.dir('frontend/src'))
    inputs.file(layout.projectDirectory.file('frontend/index.html'))
    outputs.dir(layout.projectDirectory.dir('frontend/dist'))
    outputs.upToDateWhen { false }
    onlyIf { !externallyBuiltFrontend }
}

tasks.register('verifyFrontendDist') {
    group = 'build'
    description = 'Fails if the already-built React application is missing.'
    inputs.file(frontendDistDirectory.map { it.file('index.html') })
    doLast {
        def indexFile = frontendDistDirectory.get().file('index.html').asFile
        if (!indexFile.isFile()) {
            throw new GradleException("Frontend build is missing: ${indexFile}. Run npm run build or pass -PfrontendDistDir=<built dist directory>.")
        }
    }
}

tasks.named('processResources') {
    dependsOn(externallyBuiltFrontend ? 'verifyFrontendDist' : 'frontendBuild')
    from(frontendDistDirectory) {
        into 'static'
    }
}

tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'performance'
    }
}

tasks.register('performanceTest', Test) {
    description = 'Runs the opt-in 10,000 employee synchronization benchmark.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'performance'
    }
    maxParallelForks = 1
    outputs.upToDateWhen { false }
    systemProperty 'day12.performance.output-dir', layout.buildDirectory.dir('reports/performance').get().asFile.absolutePath
}
